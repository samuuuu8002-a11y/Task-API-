<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task API</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 30px auto;
        }

        .task {
            background: white;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
        }

        .task h3 {
            margin: 0 0 8px;
        }

        .completed {
            color: green;
            font-weight: bold;
        }

        .pending {
            color: red;
            font-weight: bold;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>Task API</h1>
    <p>Task Management System</p>
</header>

<div class="container">

    <button onclick="loadTasks()">Load Tasks</button>

    <div id="message"></div>
    <div id="tasks"></div>

</div>

<script>
async function loadTasks() {

    const tasksDiv = document.getElementById("tasks");
    const message = document.getElementById("message");

    message.innerHTML = "Loading tasks...";
    tasksDiv.innerHTML = "";

    try {

        const response = await fetch("https://dummyjson.com/todos");
        const data = await response.json();

        message.innerHTML = "";

        data.todos.slice(0, 10).forEach(task => {

            const taskDiv = document.createElement("div");

            taskDiv.className = "task";

            taskDiv.innerHTML = `
                <h3>${task.todo}</h3>
                <p>Task ID: ${task.id}</p>
                <p class="${task.completed ? 'completed' : 'pending'}">
                    ${task.completed ? 'Completed' : 'Pending'}
                </p>
            `;

            tasksDiv.appendChild(taskDiv);

        });

    } catch (error) {

        message.innerHTML = "Failed to load tasks.";

    }
}
</script>

</body>
</html>
